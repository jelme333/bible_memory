  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
      -webkit-overflow-scrolling:auto;position:fixed;top:0;left:0;right:0;bottom:0;

    #root{width:100%;height:100%;}
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-thumb{background:#D4C9BA;border-radius:10px;}
    @keyframes slideFromRight{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideFromLeft{from{transform:translateX(-28px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
    .anim-right{animation:slideFromRight 0.28s cubic-bezier(.2,.8,.2,1) both}
    .anim-left{animation:slideFromLeft 0.28s cubic-bezier(.2,.8,.2,1) both}
    .anim-up{animation:fadeUp 0.28s cubic-bezier(.2,.8,.2,1) both}
    .card-press{transition:transform .12s ease}.card-press:active{transform:scale(.979)}
    .cat-card{transition:transform .12s ease}.cat-card:active{transform:scale(.955)}
  </style>

  '히11:6':'faith','롬1:17':'faith','마17:20':'faith','갈5:6':'faith','롬4:18':'faith','고후5:7':'faith','롬14:22-23':'faith','요20:29':'faith','요6:29':'faith','롬10:11':'faith','히12:2':'faith','잠3:5-6':'faith','잠3:5':'faith','빌4:13':'faith','사30:15':'faith','고후4:18':'faith','갈3:10':'faith',
  '마11:28-29':'hope','요14:27':'hope','시34:18':'hope','롬8:38-39':'hope','시23:1-3':'hope','시121:1-2':'hope','시27:1':'hope','사30:18':'hope','롬5:3-4':'hope','히10:36':'hope','롬8:25':'hope','사26:3':'hope','애3:22-23':'hope','시23:4':'hope','요14:1':'hope','롬8:28':'hope','고후4:16':'hope','마6:31-34':'hope','벧전5:7':'hope','시118:6':'hope',
  '시91:1-2':'protection','시91:11-12':'protection','나1:7':'protection','시32:7':'protection','시18:2':'protection','신31:6':'protection','시46:1':'protection','시56:3':'protection','롬8:37':'protection','대하32:8':'protection','출14:14':'protection','롬16:20':'protection','사54:17':'protection','고전15:57':'protection','고후2:14':'protection','롬8:31-34':'protection','시18:34':'protection','시18:39':'protection','시18:47':'protection','계12:11':'protection','잠21:31':'protection','딤전6:12':'protection','마28:18':'protection','엡6:11':'protection','엡6:12':'protection','벧전5:8':'protection','요일5:18':'protection','마10:16':'protection',
  '롬8:26':'spirit','요14:26':'spirit','막13:11':'spirit','갈5:22-23':'spirit','엡4:30':'spirit','롬8:14':'spirit','요16:13':'spirit','요14:16-17':'spirit','갈4:6':'spirit','빌2:13':'spirit','약4:5':'spirit','고전14:2':'spirit',
  '요3:16':'salvation','롬3:23':'salvation','롬6:23':'salvation','행4:12':'salvation','요14:6':'salvation','딤전2:5':'salvation','요일5:11-12':'salvation','고후5:17':'salvation','요1:12':'salvation','계3:20':'salvation','갈3:13':'salvation','히8:12':'salvation','히9:22':'salvation','롬5:10':'salvation','행16:31':'salvation','요5:24':'salvation','요8:32':'salvation','엡2:4-5':'salvation','고전11:25':'salvation','히10:19':'salvation','요10:10':'salvation',
  '딤후3:16-17':'scripture','시119:105':'scripture','시119:11':'scripture','시119:9':'scripture','수1:8':'scripture','골3:16':'scripture','렘23:29':'scripture','시19:14':'scripture','딤전4:5':'scripture',
  '골3:23-24':'life','엡4:29':'life','롬12:1-2':'life','약1:22':'life','미6:8':'life','고전10:31':'life','갈6:9':'life','벧전2:12':'life','롬12:21':'life','히12:15':'life','잠28:13':'life','약1:2-4':'life','시1:1-2':'life','눅9:23':'life','마5:16':'life','잠2:11':'life','잠16:21':'life','빌4:11':'life','욥23:10':'life','삼상15:22':'life','딤전5:8':'life','수3:5':'life','빌4:5':'life','살전4:3-4':'life','고전10:12-13':'life','롬12:3':'life','롬14:1':'life','엡4:26-27':'life','시51:10':'life','시19:12':'life','마12:36-37':'life','롬14:17':'life','고전15:58':'life','딤전6:17':'life',
  '요4:24':'god','신6:4':'god','시139:1-3':'god','말3:6':'god','요일1:5':'god','시90:2':'god','창1:27':'god','출20:3':'god','출34:6':'god','창1:1':'god','삼상16:7':'god','말3:10':'god','신28:2':'god','시84:11':'god','시91:14':'god','사9:6':'god','빌2:9-11':'god','요17:21':'god',
  '마28:19-20':'mission','요15:5':'mission','사43:21':'mission','고전15:20':'mission','요5:29':'mission','행1:11':'mission',
  '막11:24':'prayer','렘29:13':'prayer','골4:2':'prayer','요16:24':'prayer','요삼1:2':'prayer','막11:25':'prayer','롬12:12':'prayer','시66:18':'prayer',
};
const getCatDefault=(ref)=>{ const k=ref.replace(/[\[\]]/g,'').split(',')[0].trim(); return CAT_MAP[k]||'other'; };
const getCatInfo=(id)=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];

/* ── DB ── */
const dbHelper=(()=>{
  let _db=null;
  const init=()=>new Promise((res,rej)=>{
    if(_db)return res(_db);
    const r=indexedDB.open('BibleAppDB_v3',1);
    r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('state'))e.target.result.createObjectStore('state');};
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=e=>rej(e.target.error);
  });
  const run=async(mode,fn)=>{
    const db=await init();
    return new Promise((res,rej)=>{
      const tx=db.transaction('state',mode);
      fn(tx.objectStore('state'),res,rej);
      tx.onerror=()=>rej(tx.error);
    });
  };
  return{
    get:(key)=>run('readonly',(s,res)=>{const r=s.get(key);r.onsuccess=()=>res(r.result);}),
    set:(key,val)=>run('readwrite',(s,res)=>{s.put(val,key);s.transaction.oncomplete=res;}),
  };
})();

/* ── PARSE ── */
const parseVerses=(raw)=>{
  const blocks=raw.split(/\n(?=\[)/);
  let id=1;
  return blocks.map(b=>{
    const m=b.match(/^(\[[^\]]+\])\s*([\s\S]+)$/);
    if(!m)return null;
    const ref=m[1];
    return{id:id++,reference:ref,text:m[2].trim(),category:getCatDefault(ref),isMemorized:false,isBookmarked:false};
  }).filter(Boolean);
};

const TABS=['home','search','bookmarked','unmemorized'];
const DEF_SCROLLS=()=>({home:0,search:0,bookmarked:0,unmemorized:0});

/* ── LOGIC ── */
function useBibleLogic(raw){
  const base=useMemo(()=>parseVerses(raw),[]);
  const [verses,setVerses]=useState(()=>parseVerses(raw));
  const [isLoaded,setIsLoaded]=useState(false);

  const initUI=useMemo(()=>{
    try{
      const s=JSON.parse(localStorage.getItem('bible_v3')||'null');
      /* 재시작 시 항상 홈(카테고리 그리드)에서 시작, 스크롤 위치만 복원 */
      if(s)return{tab:'home',scrolls:{...DEF_SCROLLS(),...(s.scrolls||{})},q:''};
    }catch(e){}
    return{tab:'home',scrolls:DEF_SCROLLS(),q:''};
  },[]);

  const [tab,setTab]=useState(initUI.tab);
  const [cat,setCat]=useState(null);         /* selected category */
  const [scrolls,setScrolls]=useState(initUI.scrolls);
  const [q,setQ]=useState(initUI.q);
  const [vc,setVc]=useState(40);             /* visibleCount */
  const [toast,setToast]=useState('');

  const vcRef=useRef(40);
  const scrollsRef=useRef(initUI.scrolls);
  const catRef=useRef(null);
  const catScrollsRef=useRef({});   /* {tabId_catId: scrollY} */
  const timerRef=useRef(null);      /* single scroll-restore timer slot */
  useEffect(()=>{vcRef.current=vc;},[vc]);
  useEffect(()=>{scrollsRef.current=scrolls;},[scrolls]);
  useEffect(()=>{catRef.current=cat;},[cat]);

  const el=()=>document.getElementById('bs');
  const saveUI=useCallback((t,sc,query)=>{
    try{localStorage.setItem('bible_v3',JSON.stringify({tab:t,scrolls:sc,q:query}));}catch(e){}
  },[]);

  /* load */
  useEffect(()=>{
    Promise.all([dbHelper.get('bsave'),dbHelper.get('bcustom')]).then(([saved,custom])=>{
      let merged=[...base];
      if(Array.isArray(custom)&&custom.length>0){
        const mx=Math.max(...merged.map(v=>v.id),0);
        merged=[...merged,...custom.map((v,i)=>({...v,id:mx+i+1,category:v.category||getCatDefault(v.reference)}))];
      }
      if(saved){
        merged=merged.map(v=>{
          const d=saved[v.reference]||saved[v.id]||null;
          return d?{...v,isMemorized:d.m||false,isBookmarked:d.b||false,category:d.c||v.category}:v;
        });
      }
      setVerses(merged);setIsLoaded(true);
    }).catch(()=>setIsLoaded(true));
  },[]);

  /* save memorized/bookmarked/category */
  useEffect(()=>{
    if(!isLoaded)return;
    const out={};
    verses.forEach(v=>{
      const dc=getCatDefault(v.reference);
      if(v.isMemorized||v.isBookmarked||v.category!==dc)
        out[v.reference]={m:v.isMemorized,b:v.isBookmarked,c:v.category};
    });
    dbHelper.set('bsave',out);
  },[verses,isLoaded]);

  /* save custom */
  useEffect(()=>{
    if(!isLoaded)return;
    dbHelper.set('bcustom',verses.filter(v=>v.isCustom).map(({id,...r})=>r));
  },[verses,isLoaded]);

  /* tab change */
  const changeTab=useCallback((nt)=>{
    if(nt===tab)return;                                   /* 같은 탭 연속 탭 방지 */
    clearTimeout(timerRef.current);
    const e=el();
    /* 카테고리 안에 있었다면 그 스크롤도 저장 */
    if(catRef.current&&e) catScrollsRef.current[`${tab}_${catRef.current}`]=e.scrollTop;
    const sc={...scrollsRef.current,[tab]:catRef.current?scrollsRef.current[tab]:e?.scrollTop||0};
    setScrolls(sc);setCat(null);setQ('');setVc(40);setTab(nt);saveUI(nt,sc,'');
  },[tab,saveUI]);

  /* category select */
  const selectCat=useCallback((cid)=>{
    clearTimeout(timerRef.current);
    const e=el();
    const sc={...scrollsRef.current,[tab]:e?.scrollTop||0};
    setScrolls(sc);setCat(cid);setVc(40);
    /* 다음 프레임에 해당 카테고리의 저장된 스크롤로 복원 */
    timerRef.current=setTimeout(()=>{
      const saved=catScrollsRef.current[`${tab}_${cid}`]||0;
      el()?.scrollTo({top:saved,behavior:'instant'});
    },0);
  },[tab]);

  /* back */
  const goBack=useCallback(()=>{
    clearTimeout(timerRef.current);
    const e=el();
    if(catRef.current&&e) catScrollsRef.current[`${tab}_${catRef.current}`]=e.scrollTop;
    setCat(null);setVc(40);
    timerRef.current=setTimeout(()=>{
      el()?.scrollTo({top:scrollsRef.current[tab]||0,behavior:'instant'});
    },0);
  },[tab]);

  /* 탭 전환 시 스크롤 동기 복원 (카테고리 안이면 스킵) */
  useLayoutEffect(()=>{
    if(!isLoaded||catRef.current)return;
    clearTimeout(timerRef.current);
    const e=el();
    if(e) e.scrollTop=scrollsRef.current[tab]||0;
  },[tab,isLoaded]);

  /* 스크롤 위치 자동 저장 */
  useEffect(()=>{
    if(!isLoaded)return;
    let tid;
    const save=()=>{
      const e=el();if(!e)return;
      if(catRef.current){
        catScrollsRef.current[`${tab}_${catRef.current}`]=e.scrollTop;
      } else {
        const sc={...scrollsRef.current,[tab]:e.scrollTop};
        setScrolls(sc);saveUI(tab,sc,q);
      }
    };
    const onS=()=>{clearTimeout(tid);tid=setTimeout(save,150);};
    const onH=()=>{if(document.visibilityState==='hidden')save();};
    el()?.addEventListener('scroll',onS,{passive:true});
    window.addEventListener('visibilitychange',onH);
    return()=>{el()?.removeEventListener('scroll',onS);window.removeEventListener('visibilitychange',onH);clearTimeout(tid);};
  },[tab,isLoaded,q,saveUI]);

  const changeQ=useCallback((v)=>{setQ(v);setVc(40);el()?.scrollTo({top:0,behavior:'instant'});},[]);
  const toggleM=useCallback((id)=>setVerses(p=>p.map(v=>v.id===id?{...v,isMemorized:!v.isMemorized}:v)),[]);
  const toggleB=useCallback((id)=>setVerses(p=>p.map(v=>v.id===id?{...v,isBookmarked:!v.isBookmarked}:v)),[]);
  const updateCat=useCallback((id,nc)=>setVerses(p=>p.map(v=>v.id===id?{...v,category:nc}:v)),[]);
  const addVerse=useCallback((ref,text,category)=>{
    const r=ref.trim().startsWith('[')?ref.trim():`[${ref.trim()}]`;
    setVerses(p=>{const mx=Math.max(...p.map(v=>v.id),0);return[...p,{id:mx+1,reference:r,text:text.trim(),category:category||'other',isMemorized:false,isBookmarked:false,isCustom:true}];});
  },[]);

  const filtered=useMemo(()=>verses.filter(v=>{
    if(tab==='bookmarked'&&!v.isBookmarked)return false;
    if(tab==='unmemorized'&&v.isMemorized)return false;
    if(cat&&v.category!==cat)return false;
    if(q.trim()){const lq=q.trim().toLowerCase();return v.reference.toLowerCase().includes(lq)||v.text.toLowerCase().includes(lq);}
    return true;
  }),[verses,tab,cat,q]);

  const displayed=useMemo(()=>filtered.slice(0,vc),[filtered,vc]);
  const loadMore=useCallback(()=>setVc(p=>p+40),[]);

  const stats=useMemo(()=>({
    total:verses.length,
    memorized:verses.filter(v=>v.isMemorized).length,
    bookmarked:verses.filter(v=>v.isBookmarked).length,
  }),[verses]);

  const catStats=useMemo(()=>{
    const m={};
    CATS.forEach(ct=>{
      const cv=verses.filter(v=>v.category===ct.id);
      m[ct.id]={total:cv.length,mem:cv.filter(v=>v.isMemorized).length,unm:cv.filter(v=>!v.isMemorized).length};
    });
    return m;
  },[verses]);

  const showToast=useCallback((msg)=>{setToast(msg);setTimeout(()=>setToast(''),2500);},[]);
  const share=useCallback(async(verse)=>{
    const txt=`${verse.reference}\n${verse.text}`;
    if(navigator.share){try{await navigator.share({title:'말씀 공유',text:txt});}catch(e){}}
    else{try{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('말씀이 복사되었습니다!');}catch(e){}}
  },[showToast]);
  const toTop=useCallback(()=>el()?.scrollTo({top:0,behavior:'smooth'}),[]);

  return{verses,displayed,filteredCount:filtered.length,tab,changeTab,cat,selectCat,goBack,q,changeQ,toggleM,toggleB,updateCat,share,addVerse,vc,loadMore,toast,showToast,toTop,isLoaded,stats,catStats};
}

const HiText=({text,q})=>{
  if(!q||!q.trim())return <span>{text}</span>;
  const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const parts=text.split(new RegExp(`(${esc})`,'gi'));
  return<span>{parts.map((p,i)=>p.toLowerCase()===q.toLowerCase()?<span key={i} className="font-extrabold bg-yellow-200 rounded px-0.5" style={{color:'#92400E'}}>{p}</span>:<span key={i}>{p}</span>)}</span>;
};

/* BottomSheet 공통 래퍼 */
const Sheet=({onClose,children,zIndex=80})=>{
  const [closing,setClosing]=React.useState(false);
  const [dragY,setDragY]=React.useState(0);
  const sy=React.useRef(null);
  const close=()=>{setClosing(true);setTimeout(onClose,280);};
  const onTS=e=>{sy.current=e.touches[0].clientY;};
  const onTM=e=>{const dy=e.touches[0].clientY-sy.current;if(dy>0){e.preventDefault();setDragY(dy);}};
  const onTE=()=>{if(dragY>80)close();else setDragY(0);sy.current=null;};
  const style=closing?{transform:'translateY(100%)',transition:'transform .28s cubic-bezier(.4,0,.2,1)'}
    :dragY>0?{transform:`translateY(${dragY}px)`,transition:'none'}
    :{transform:'translateY(0)',transition:'transform .32s cubic-bezier(.32,.72,0,1)'};
  return(
    <div className="fixed inset-0 flex items-end justify-center" style={{zIndex}}>
      <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={close} style={{opacity:closing?0:1,transition:'opacity .28s ease'}}/>
      <div className="relative w-full max-w-lg bg-white rounded-t-3xl shadow-2xl z-10" style={{...style,paddingBottom:'max(env(safe-area-inset-bottom),1.5rem)'}}>
        <div className="flex justify-center pt-3 pb-1 touch-none cursor-grab" onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
          <div className="w-10 h-1 bg-gray-200 rounded-full"/>
        </div>
        {children(close)}
      </div>
    </div>
  );
};

                          onShare={L.share} q={L.q} onCatTap={setPickerVerse}/>
                      ))}
                    </div>
                    {L.vc<L.filteredCount&&(
                      <div className="px-4 pb-8">
                        <button onClick={L.loadMore} className="w-full py-3.5 text-sm font-bold rounded-2xl border-2 active:opacity-70"
                          style={{borderColor:'#DDD6FE',color:'#5B21B6',backgroundColor:'#F5F3FF'}}>
                          더 보기 ({L.filteredCount-L.vc}개 남음)
                        </button>
                      </div>
                    )}
                  </>
                )
              }
            </div>
          )}
        </div>
      </main>

      <BottomNav tab={L.tab} onChange={L.changeTab}/>

      {showAdd&&<AddSheet onClose={()=>setShowAdd(false)} onAdd={L.addVerse} showToast={L.showToast}/>}
      {pickerVerse&&(
        <CatPickerSheet verse={pickerVerse} onClose={()=>setPickerVerse(null)}
          onSelect={(id,nc)=>{L.updateCat(id,nc);L.showToast(`✅ ${getCatInfo(nc).emoji} ${getCatInfo(nc).label}(으)로 이동했어요`);setPickerVerse(null);}}/>
      )}
      <Toast msg={L.toast}/>
    </div>
  );
}
